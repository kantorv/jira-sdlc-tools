name: Reviewer Skill on PR (Smoke Test)

# Wiring smoke test for the jira-task-reviewer skill in CI. On an opened or
# reopened PR it boots Kimi Code, writes a correct ~/.kimi-code/config.toml
# pointing extra_skill_dirs at this plugin's skills/, and confirms the three
# jira-sdlc skills are discoverable. It does NOT run the reviewer skill to
# completion and posts no review to Jira or GitHub — discovery only. If a
# real reviewer run is wanted later, that needs a worktree checkout plus
# gh auth and the Jira credentials in jira-sdlc-tools.local.env, which is
# out of scope here.
#
# The existing workflow_dispatch-only reviewer.yml demo is left untouched.

on:
  workflow_dispatch:

jobs:
  check_pr_exists:
    runs-on: ubuntu-latest
    name: Check PR exists
    outputs:
      pr_exists: ${{ steps.check_pr.outputs.pr_exists }}

    steps:
      - uses: actions/checkout@v6


      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Check if PR already exists # skip e2e once a PR is open (CI runs there)
        id: check_pr
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.repository }}"
          # PRDATA=$(gh pr list --head  $BRANCH_NAME  --json number --jq '.')
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --repo "$REPO_NAME" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            echo "pr_exists=1" >> $GITHUB_OUTPUT
          else
            echo "pr_exists=0" >> $GITHUB_OUTPUT
          fi

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  reviewer-smoke:
    needs: check_pr_exists
    if: needs.check_pr_exists.outputs.pr_exists == '1'
    # Only allocate a runner for issue branches. release/* (e.g. the cut-release
    # draft PR into main) and other non-issue head branches carry no Jira key,
    # so gating here skips them instead of spinning up a runner for a no-op.
    # Mirrors the job-level guard in jira_issue_transition_on_pr_open.yml.
    # if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6




      - name: Check if PR already exists # skip e2e once a PR is open (CI runs there)
        id: check_pr
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          REPO_NAME="${{ github.repository }}"
          # PRDATA=$(gh pr list --head  $BRANCH_NAME  --json number --jq '.')
          PR_NUMBER=$(gh pr list --head "$BRANCH_NAME" --repo "$REPO_NAME" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            echo "PR already exists: $PR_NUMBER"
            echo "pr_exists=1" >> $GITHUB_OUTPUT
          else
            echo "PR not exists"
            echo "pr_exists=0" >> $GITHUB_OUTPUT
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}




      # 1. Resolve the latest version to use as cache key
      - name: Resolve Kimi Code version
        id: kimi-version
        run: |
          VERSION=$(curl -fsSL https://code.kimi.com/kimi-code/latest)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest Kimi Code version: $VERSION"

      # 2. Restore cache
      - name: Cache Kimi Code CLI
        id: cache-kimi
        uses: actions/cache@v4
        with:
          path: ~/.kimi-code
          key: kimi-code-${{ runner.os }}-${{ steps.kimi-version.outputs.version }}
          restore-keys: |
            kimi-code-${{ runner.os }}-

      # 3. Install only on cache miss
      - name: Install Kimi Code
        if: steps.cache-kimi.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash



      # 4. Always add to PATH for this and subsequent steps
      - name: Add Kimi to PATH
        run: echo "$HOME/.kimi-code/bin" >> "$GITHUB_PATH"

      - name: Write Kimi Code config.toml
        shell: bash
        env:
          # NVIDIA_NIM_API_KEY is an existing repo secret. Map it to the
          # provider api_key the way the reviewer.yml demo does
          # (env -> [providers.nvidia].api_key), not via a placeholder + sed.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::NVIDIA_NIM_API_KEY secret is empty or unset — cannot configure the NVIDIA provider."
            exit 1
          fi

          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is empty or unset — cannot configure the OPENROUTER provider."
            exit 1
          fi
          mkdir -p ~/.kimi-code
          # Unquoted heredoc is intentional: $(pwd) and ${NVIDIA_API_KEY} expand
          # to the runner workspace / secret value as the file is written. The
          # reviewer.yml demo ships a TOML quoting bug here (a missing *opening*
          # double-quote on the array element) that this file fixes, not copies;
          # the corrected form is a properly quoted string "$(pwd)/...".
          cat > ~/.kimi-code/config.toml <<EOF
          # default_model = "nvidia/z-ai/glm-5.2"
          default_model = "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"

          extra_skill_dirs = [
            "$(pwd)/plugins/jira-sdlc/skills"
          ]

          [providers.nvidia]
          type = "openai"
          api_key = "${NVIDIA_API_KEY}"
          base_url = "https://integrate.api.nvidia.com/v1"

          [providers.openrouter]
          type = "openai"
          api_key = "${OPENROUTER_API_KEY}"
          base_url = "https://openrouter.ai/api/v1"


          [models."nvidia/z-ai/glm-5.2"]
          provider = "nvidia"
          model = "z-ai/glm-5.2"
          max_context_size = 1000000
          max_output_size = 131072
          capabilities = ["thinking", "tool_use"]
          display_name = "GLM-5.2"
          reasoning_key = "reasoning_content"

          [models."openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"]
          provider = "openrouter"
          model = "nvidia/nemotron-3-ultra-550b-a55b:free"
          max_context_size = 1000000
          max_output_size = 65536
          capabilities = [ "always_thinking", "tool_use" ]
          display_name = "Nemotron 3 Ultra (free)"
          support_efforts = [ "medium", "high" ]

          [thinking]
          enabled = true
          EOF

      - name: Verify installation
        run: |
          kimi --version
          echo "Configuration (~/.kimi-code/config.toml):"
          cat ~/.kimi-code/config.toml

      - name: Validate config.toml
        run: kimi doctor config

      - name: AI review
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=$(kimi -p "
            You are a senior software engineer performing a thorough code review of a pull request.

            ## Instructions
            1. Get the **final combined diff** (not individual commits) by running:
              \`gh pr diff $PR_NUMBER --color=never\`

            2. Analyze **only the changes** in the diff. Do not review unrelated files.

            3. Produce a clear, actionable review and write it to \`/tmp/report.md\`.

            ## Review criteria (prioritize in this order)
            - Correctness & logic bugs
            - Security issues / data exposure / injection risks
            - Error handling & edge cases
            - Performance / resource leaks
            - Breaking changes or API compatibility
            - Test coverage gaps for the new code
            - Code clarity, naming, and maintainability
            - Obvious style/convention violations (only if they hurt readability)

            ## Output format for /tmp/report.md
            Use this exact structure:

            # Code Review – PR #$PR_NUMBER

            ## Summary
            2–4 sentence high-level assessment (overall quality + main risks).

            ## Critical Issues
            - List only real bugs, security problems, or things that must be fixed before merge.
            - For each item: file + approximate location + why it matters + suggested fix.

            ## Suggestions
            - Improvements that would make the code better but are not blockers.
            - Keep them concrete and actionable.

            ## Positive Notes
            - Briefly mention anything done particularly well (good structure, clear naming, solid tests, etc.).

            ## Verdict
            One of: **Approve** / **Request Changes** / **Comment only**  
            (with a one-line justification)

            ## Rules
            - Be specific. Quote or refer to the actual changed lines when possible.
            - Prefer short, direct language.
            - Do not invent issues that aren't in the diff.
            - Do not comment on formatting/style unless it meaningfully hurts readability.
            - Keep the whole report under ~400 lines.

            After writing the file, post it as a PR review comment with:
            \`gh pr review $PR_NUMBER --comment --body-file /tmp/report.md\`
            ")
          echo "$OUTPUT"

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-report
          path: /tmp/report.md