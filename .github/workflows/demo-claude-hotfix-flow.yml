# ⚠️ THIS IS A JOB-CHAINING DEMO — NOT THIS REPO'S HOTFIX PROCEDURE. ⚠️
#
# What it demonstrates: how the three jira-sdlc skills chain across GitHub
# Actions jobs — assigner → executor → reviewer — each running headlessly in
# its own runner, each as its own Jira identity, with the issue key and branch
# handed forward through job outputs. It exists to show the CI wiring pattern.
#
# What it is NOT: the real emergency-hotfix workflow. A production hotfix in
# this repo is a human decision (SDLC.md §4): a human cuts or requests
# `hotfix/*` off `main`, a human reviews it, and a human merges it — after
# which release.yml patch-bumps the tag. Nothing here should be read as "run
# this when prod is broken". The bug it fixes is whatever text you type into
# the dispatch input, on a runner, unattended; that is a demo, not an incident
# response. It also can't answer clarifying questions (a headless `-p` run has
# no interactive turn), so a run where the assigner stops to ask ends with no
# branch and job 1 fails loud rather than guessing.
#
# The hotfix *branch semantics* are real, though: job 1 relies on
# jira-task-assigner step 5C (JST-184), which on an explicit hotfix directive
# cuts `hotfix/<KEY>-<slug>` from the fetched `origin/<PRODUCTION_BRANCH>` and
# forces single-step scope. Before JST-184 landed, the same prompt produced a
# plain `feature/<KEY>` branch off the base branch and a PR aimed at staging.
#
# Gating: every job declares `environment: production`, so GitHub's
# environment-protection rule pauses for approval *before each job starts* —
# one approval per skill (job 2 waits after job 1, job 3 waits after job 2).
# One environment reused per job is enough; three separate environments buy
# nothing here.
#
# ── Caveats worth knowing before you copy this into another repo ──────────
#
#  1. **No shared disk between jobs.** WORKTREES_DIR conventions assume a
#     persistent checkout with sibling worktrees; GitHub-hosted runners give
#     each job a fresh VM. So nothing is carried over on disk: job 1 pushes
#     the branch to origin, and jobs 2/3 rebuild a *linked* worktree for it
#     from scratch. That rebuild is not optional decoration — the executor and
#     reviewer both stop unless `.git` is a file (a linked worktree) on a
#     `feature/*` / `hotfix/*` branch, which a bare `actions/checkout` is not.
#
#     Same reason every job rebuilds `.jst/jira-sdlc-tools.local.env` for
#     itself: there is no earlier job's copy to inherit. Those three bootstrap
#     steps are near-identical **on purpose** and are not factored into a
#     shared composite action or helper script — this repo has no CI-reuse
#     mechanism anywhere (the three `jira_issue_transition_on_*.yml` files are
#     likewise ~45 of 75 lines identical), and these workflows are meant to be
#     *copied into other repos*, which a sibling helper file quietly breaks.
#     Keep the copies byte-identical apart from the role, so a diff between
#     two jobs shows only what genuinely differs.
#  2. **`git config branch.<b>.parentbranch` is machine-local**, so it never
#     survives to jobs 2/3 either. They re-set it from job 1's outputs. The
#     assigner's `PR target branch: …` Jira comment is the durable fallback
#     the skills would otherwise use.
#  3. **Do not export `GH_TOKEN`/`GITHUB_TOKEN` into a step that runs a
#     skill.** Every skill starts with statuscheck, which reads
#     GITHUB_PAT_TOKEN *out of the env file* (not the environment) and runs
#     `gh auth logout && gh auth login --with-token` with it; gh refuses that
#     login while either token variable is set — "first clear the value from
#     the environment", exit 1 — which FAILs the `gh_auth` row and aborts the
#     run before any work happens. That is why the token is written into
#     `.jst/jira-sdlc-tools.local.env` and the `env:` blocks below stop at the
#     file-writing steps. `git push` is unaffected: it uses the credentials
#     actions/checkout persisted in `.git/config`.
#  4. **Self-review.** Job 3's gh session is the same account that opened the
#     PR in job 2, and GitHub blocks approving your own PR — the reviewer
#     skill already posts its verdict as a PR *comment* for this reason.
#  5. **The skills come from the base-branch checkout**, because the assigner
#     refuses to run from an issue branch (its step 2). Dispatching this from
#     a `feature/*` branch therefore does *not* exercise that branch's copy of
#     the skills; land them on the base branch first.
#
# ── Secrets ───────────────────────────────────────────────────────────────
#
# All of them are **environment secrets on `production`** (so a job that
# forgets `environment: production` sees empty strings, not repo-level
# values), and each is named **exactly as the `jira-sdlc-tools.local.env` key
# it becomes** — which is what lets each job's first step be a single loop
# over a `KEYS` list rather than a hand-mapped list of printfs:
#
#   ANTHROPIC_API_KEY     every job (read from the environment by the CLI —
#                         the only one never written to the file)
#   JIRA_ACCOUNT_URL      every job
#   JIRA_ASSIGNER_EMAIL / JIRA_ASSIGNER_TOKEN    job 1 only
#   JIRA_EXECUTOR_EMAIL / JIRA_EXECUTOR_TOKEN    job 2 only  (job 1 also gets
#                         the *email* — it's an assignment target, not a
#                         credential; see the step comment there)
#   JIRA_REVIEWER_EMAIL / JIRA_REVIEWER_TOKEN    job 3 only
#   GITHUB_PAT_TOKEN      every job, optional — see below
#
# `WORKTREES_DIR` is the one key that is *not* a secret: it's computed per job
# as a path under RUNNER_TEMP, because a value carried over from a developer's
# machine would point somewhere that doesn't exist on the runner.
#
# None of these exist in this repo yet — every job checks its own set up front
# and fails loud with `::error::` rather than letting the claude CLI die on an
# unset key halfway through.
#
# For GitHub itself no new secret is needed: `GITHUB_PAT_TOKEN` falls back to
# the runner's built-in `secrets.GITHUB_TOKEN`, which can push and open a PR
# given the job `permissions:` below. Add the PAT secret only to lift the one
# real limitation of the built-in token — a PR opened with it does not trigger
# other workflows, so the repo's own `jira_issue_transition_on_pr_open.yml`
# stays silent for the demo's PR (the executor skill transitions Jira itself,
# so the chain still completes either way).

name: Demo — Claude hotfix flow (assigner → executor → reviewer)

on:
  workflow_dispatch:
    inputs:
      issue_text:
        description: The bug report the assigner turns into a Jira Bug + hotfix branch
        required: true
        type: string

# Two runs at once would race on the same Jira project and push sibling
# hotfix branches — serialize them, and don't cancel a run mid-skill.
concurrency:
  group: demo-claude-hotfix-flow
  cancel-in-progress: false

env:
  # Pinned deliberately, same as validator.yml: a float would let an upstream
  # CLI change break this demo on an unrelated day. Workflow-level env can't
  # cross files, so validator.yml hardcodes the same pin — bump both together.
  CLAUDE_CLI_VERSION: 2.1.220

jobs:
  # ── Job 1 ── assigner: bug text → Jira Bug + hotfix/<KEY>-<slug> off main ──
  assign:
    name: 1 · assigner — create the Bug and hotfix branch
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write # the assigner pushes the new hotfix branch
    outputs:
      issue_key: ${{ steps.assigned.outputs.issue_key }}
      branch: ${{ steps.assigned.outputs.branch }}
      pr_base: ${{ steps.config.outputs.production_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + every remote ref: the assigner cuts the hotfix from
          # a fetched origin/<PRODUCTION_BRANCH>, which a shallow single-branch
          # clone doesn't have.
          fetch-depth: 0

      - name: Write .jst/jira-sdlc-tools.local.env (assigner role only)
        shell: bash
        env:
          # Environment secrets on `production`, each named exactly as the
          # env-file key it becomes — which is what lets the step below be one
          # loop instead of a hand-mapped list. KEYS is the whole contract.
          KEYS: JIRA_ACCOUNT_URL JIRA_ASSIGNER_EMAIL JIRA_ASSIGNER_TOKEN JIRA_EXECUTOR_EMAIL GITHUB_PAT_TOKEN
          JIRA_ACCOUNT_URL: ${{ secrets.JIRA_ACCOUNT_URL }}
          JIRA_ASSIGNER_EMAIL: ${{ secrets.JIRA_ASSIGNER_EMAIL }}
          JIRA_ASSIGNER_TOKEN: ${{ secrets.JIRA_ASSIGNER_TOKEN }}
          # Not a credential: the assigner assigns every issue it creates to
          # the executor, and get_assignee_email.sh reads that address (and
          # only the address — no executor token) from the env file.
          JIRA_EXECUTOR_EMAIL: ${{ secrets.JIRA_EXECUTOR_EMAIL }}
          GITHUB_PAT_TOKEN: ${{  secrets.GITHUB_TOKEN }}
          # Checked here so one step catches every missing secret, but never
          # written to the file — the claude CLI reads it from the environment.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # First real step of the job: no filesystem survives from job to job,
          # so each one rebuilds this file from its own secrets. jira.sh and
          # statuscheck read credentials ONLY from here (never the
          # environment), resolved from the git top-level.
          missing=()
          for k in ANTHROPIC_API_KEY $KEYS; do
            [ -n "${!k:-}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing or empty secret(s) in the 'production' environment: ${missing[*]} — this demo cannot run without them"
            exit 1
          fi

          # Create empty and lock it down BEFORE the secrets go in.
          : > .jst/jira-sdlc-tools.local.env
          chmod 600 .jst/jira-sdlc-tools.local.env
          # printf with the value as an argument: secret values are data, never
          # re-expanded by the shell and never part of the script text.
          for k in $KEYS; do
            printf '%s=%s\n' "$k" "${!k}" >> .jst/jira-sdlc-tools.local.env
          done
          # WORKTREES_DIR is deliberately NOT a secret: it's a path on *this*
          # runner, and a value carried over from a developer's machine would
          # point somewhere that doesn't exist here.
          mkdir -p "$RUNNER_TEMP/worktrees"
          printf 'WORKTREES_DIR=%s\n' "$RUNNER_TEMP/worktrees" >> .jst/jira-sdlc-tools.local.env
          echo "Wrote $(grep -c . .jst/jira-sdlc-tools.local.env) config lines (values not echoed)."

      - name: Resolve project config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          # Branch names and the project key are <TOKEN>s from the team-shared
          # env file, never literals in this workflow (AGENTS.md).
          cfg() {
            grep -E "^[[:space:]]*$1[[:space:]]*=" .jst/jira-sdlc-tools.env \
              | tail -1 | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          for k in DEFAULT_BASE_BRANCH PRODUCTION_BRANCH PROJECT_KEY; do
            v=$(cfg "$k")
            if [ -z "$v" ]; then
              echo "::error::$k is unset in .jst/jira-sdlc-tools.env"
              exit 1
            fi
            echo "$(echo "$k" | tr '[:upper:]' '[:lower:]')=$v" >> "$GITHUB_OUTPUT"
            echo "$k=$v"
          done

      - name: Stand on the base branch
        shell: bash
        env:
          BASE: ${{ steps.config.outputs.default_base_branch }}
        run: |
          set -euo pipefail
          # Why the BASE branch and not PRODUCTION_BRANCH, on a *hotfix* demo —
          # the obvious question, so: the checkout is not what the hotfix is cut
          # from. Assigner step 5C sets BRANCH_FROM = origin/<PRODUCTION_BRANCH>,
          # the freshly fetched remote ref, precisely so a stale local
          # production branch can't poison it. Both start states its step 2
          # allows produce an identical hotfix/<KEY>-<slug> and an identical
          # production PR base, so standing here costs the demo nothing.
          #
          # Two things then make the base branch the better of the two:
          #   - the skills come from this checkout (caveat 5), and the hotfix
          #     directive reaches PRODUCTION_BRANCH only after a release — until
          #     then, standing on production would load an assigner with no
          #     hotfix path, which cuts feature/<KEY> and fails the branch check
          #     in "Capture the created issue and branch";
          #   - 5C hard-stops if it started on PRODUCTION_BRANCH and the run
          #     lands on planned work, and a headless run has no turn to
          #     recover in. From here that misread degrades instead of halting.
          # The assigner also stops outright on an issue branch, so moving off
          # whatever ref dispatched this run is required either way.
          git switch "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install claude CLI (native, no npm)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run jira-task-assigner
        id: run
        timeout-minutes: 25
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TEXT: ${{ inputs.issue_text }}
        run: |
          set -euo pipefail
          # Snapshot local hotfix branches so the next step can tell which one
          # this run created, instead of parsing the model's prose report.
          git for-each-ref --format='%(refname:short)' 'refs/heads/hotfix/*' \
            | sort > "$RUNNER_TEMP/hotfix-before.txt"

          # The two-part prompt shape the hotfix directive needs: the bug, then
          # an explicit instruction that this is an emergency hotfix off the
          # production branch. Built with printf from an env var — dispatch
          # input is data, never interpolated into the script.
          {
            printf '%s\n\n' '1. READ THE BUG'
            printf '%s\n\n' "$ISSUE_TEXT"
            printf '%s\n'   '2. CREATE AN EMERGENCY HOTFIX FROM IT BRANCHED FROM MAIN'
          } > "$RUNNER_TEMP/assigner-prompt.txt"

          # --dangerously-skip-permissions: headless runs have no interactive
          # turn to approve tool calls. Safe-ish here and nowhere else: a
          # throwaway runner VM, non-root (the flag refuses to run as root).
          claude --plugin-dir "$GITHUB_WORKSPACE/plugins/jira-sdlc" \
            --dangerously-skip-permissions \
            -p "/jira-sdlc:jira-task-assigner $(cat "$RUNNER_TEMP/assigner-prompt.txt")" \
            2>&1 | tee "$RUNNER_TEMP/assigner.log"

      - name: Capture the created issue and branch
        id: assigned
        shell: bash
        env:
          PROJECT_KEY: ${{ steps.config.outputs.project_key }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname:short)' 'refs/heads/hotfix/*' \
            | sort > "$RUNNER_TEMP/hotfix-after.txt"
          NEW=$(comm -13 "$RUNNER_TEMP/hotfix-before.txt" "$RUNNER_TEMP/hotfix-after.txt")
          COUNT=$(printf '%s' "$NEW" | grep -c . || true)

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected exactly 1 new hotfix/* branch from the assigner, found $COUNT — a run that stopped to ask a question, or that took the planned-work path, lands here. Branches: $(printf '%s' "$NEW" | tr '\n' ' ')"
            exit 1
          fi

          BRANCH="$NEW"
          KEY=$(printf '%s' "$BRANCH" | sed -nE "s#^hotfix/(${PROJECT_KEY}-[0-9]+)-.+\$#\1#p")
          if [ -z "$KEY" ]; then
            echo "::error::cannot derive a $PROJECT_KEY issue key from branch '$BRANCH'"
            exit 1
          fi

          # Jobs 2/3 get the branch from origin, so an unpushed branch is a
          # dead end — catch it here rather than in the next job's checkout.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::$BRANCH exists locally but was never pushed to origin"
            exit 1
          fi

          echo "branch=$BRANCH"       >> "$GITHUB_OUTPUT"
          echo "issue_key=$KEY"       >> "$GITHUB_OUTPUT"
          echo "### Assigned \`$KEY\` on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assigner log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: assigner-log
          path: ${{ runner.temp }}/assigner.log
          if-no-files-found: warn
          retention-days: 7

  # ── Job 2 ── executor: implement the fix, push, open the PR into main ──────
  execute:
    name: 2 · executor — implement and open the PR
    needs: assign
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      contents: write # push the implementation commits
      pull-requests: write # gh pr create
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write .jst/jira-sdlc-tools.local.env (executor role only)
        shell: bash
        env:
          # Same shape as job 1, one role over: environment secrets named
          # exactly as the env-file keys they become.
          KEYS: JIRA_ACCOUNT_URL JIRA_EXECUTOR_EMAIL JIRA_EXECUTOR_TOKEN GITHUB_PAT_TOKEN
          JIRA_ACCOUNT_URL: ${{ secrets.JIRA_ACCOUNT_URL }}
          JIRA_EXECUTOR_EMAIL: ${{ secrets.JIRA_EXECUTOR_EMAIL }}
          JIRA_EXECUTOR_TOKEN: ${{ secrets.JIRA_EXECUTOR_TOKEN }}
          GITHUB_PAT_TOKEN: ${{   secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Written in the *main checkout*, before the worktree exists: the
          # executor's own ensure_local_env.sh copies it into the worktree from
          # here, which is exactly the path that script exists to cover.
          missing=()
          for k in ANTHROPIC_API_KEY $KEYS; do
            [ -n "${!k:-}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing or empty secret(s) in the 'production' environment: ${missing[*]} — this demo cannot run without them"
            exit 1
          fi

          : > .jst/jira-sdlc-tools.local.env
          chmod 600 .jst/jira-sdlc-tools.local.env
          for k in $KEYS; do
            printf '%s=%s\n' "$k" "${!k}" >> .jst/jira-sdlc-tools.local.env
          done
          mkdir -p "$RUNNER_TEMP/worktrees"
          printf 'WORKTREES_DIR=%s\n' "$RUNNER_TEMP/worktrees" >> .jst/jira-sdlc-tools.local.env
          echo "Wrote $(grep -c . .jst/jira-sdlc-tools.local.env) config lines (values not echoed)."

      - name: Resolve project config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          # Byte-identical to job 1's copy except the key list — the three
          # copies are deliberately duplicated (see the header), so keep them
          # diffable rather than letting each grow its own variant.
          cfg() {
            grep -E "^[[:space:]]*$1[[:space:]]*=" .jst/jira-sdlc-tools.env \
              | tail -1 | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          for k in DEFAULT_BASE_BRANCH; do
            v=$(cfg "$k")
            if [ -z "$v" ]; then
              echo "::error::$k is unset in .jst/jira-sdlc-tools.env"
              exit 1
            fi
            echo "$(echo "$k" | tr '[:upper:]' '[:lower:]')=$v" >> "$GITHUB_OUTPUT"
            echo "$k=$v"
          done

      - name: Stand on the base branch
        shell: bash
        env:
          BASE: ${{ steps.config.outputs.default_base_branch }}
        run: |
          set -euo pipefail
          # The workspace stays a *main checkout* (`.git` is a directory) on a
          # long-lived branch; the issue branch gets a linked worktree below,
          # which is the only shape the executor will run in. The branch itself
          # matters less here than in job 1 — this job's work happens in the
          # worktree — but it is still where the skills are loaded from, so keep
          # it the same base branch job 1 used (see that job for why not
          # PRODUCTION_BRANCH).
          git switch "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install claude CLI (native, no npm)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rebuild the issue worktree
        id: worktree
        shell: bash
        env:
          BRANCH: ${{ needs.assign.outputs.branch }}
          KEY: ${{ needs.assign.outputs.issue_key }}
          PR_BASE: ${{ needs.assign.outputs.pr_base }}
        run: |
          set -euo pipefail
          WT="$RUNNER_TEMP/worktrees/worktree-$KEY"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git worktree add --track -B "$BRANCH" "$WT" "origin/$BRANCH"
          # parentbranch is machine-local config, so job 1's copy is gone.
          # Re-set it to what the PR must target (the production branch): it is
          # the first source the executor's PR-base resolver reads, ahead of the
          # assigner's durable "PR target branch:" Jira comment.
          git config "branch.$BRANCH.parentbranch" "$PR_BASE"
          echo "path=$WT" >> "$GITHUB_OUTPUT"

      - name: Run jira-task-executor
        timeout-minutes: 35
        shell: bash
        working-directory: ${{ steps.worktree.outputs.path }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # No key argument by contract — the executor derives it from the
          # branch this worktree is on.
          claude --plugin-dir "$GITHUB_WORKSPACE/plugins/jira-sdlc" \
            --dangerously-skip-permissions \
            -p "/jira-sdlc:jira-task-executor" \
            2>&1 | tee "$RUNNER_TEMP/executor.log"

      - name: Confirm a PR was opened
        shell: bash
        env:
          GITHUB_PAT_TOKEN: ${{ secrets.GITHUB_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.assign.outputs.branch }}
        run: |
          set -euo pipefail
          # GH_TOKEN is set only *here* — after the skill has finished — so it
          # can't break statuscheck's `gh auth login --with-token` (caveat 3).
          PR=$(GH_TOKEN="$GITHUB_PAT_TOKEN" gh pr list --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::error::the executor opened no PR for $BRANCH — job 3 has nothing to review"
            exit 1
          fi
          echo "### Executor opened PR #$PR for \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload executor log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executor-log
          path: ${{ runner.temp }}/executor.log
          if-no-files-found: warn
          retention-days: 7

  # ── Job 3 ── reviewer: review the PR, post the verdict to GitHub + Jira ────
  review:
    name: 3 · reviewer — review the PR
    needs: [assign, execute]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # posts the review as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write .jst/jira-sdlc-tools.local.env (reviewer role only)
        shell: bash
        env:
          # Same shape again, reviewer role. The reviewer's credential is the
          # only Jira secret this job can see.
          KEYS: JIRA_ACCOUNT_URL JIRA_REVIEWER_EMAIL JIRA_REVIEWER_TOKEN GITHUB_PAT_TOKEN
          JIRA_ACCOUNT_URL: ${{ secrets.JIRA_ACCOUNT_URL }}
          JIRA_REVIEWER_EMAIL: ${{ secrets.JIRA_REVIEWER_EMAIL }}
          JIRA_REVIEWER_TOKEN: ${{ secrets.JIRA_REVIEWER_TOKEN }}
          GITHUB_PAT_TOKEN: ${{ secrets.GITHUB_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for k in ANTHROPIC_API_KEY $KEYS; do
            [ -n "${!k:-}" ] || missing+=("$k")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing or empty secret(s) in the 'production' environment: ${missing[*]} — this demo cannot run without them"
            exit 1
          fi

          : > .jst/jira-sdlc-tools.local.env
          chmod 600 .jst/jira-sdlc-tools.local.env
          for k in $KEYS; do
            printf '%s=%s\n' "$k" "${!k}" >> .jst/jira-sdlc-tools.local.env
          done
          mkdir -p "$RUNNER_TEMP/worktrees"
          printf 'WORKTREES_DIR=%s\n' "$RUNNER_TEMP/worktrees" >> .jst/jira-sdlc-tools.local.env
          echo "Wrote $(grep -c . .jst/jira-sdlc-tools.local.env) config lines (values not echoed)."

      - name: Resolve project config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          # Byte-identical to job 1's copy except the key list — the three
          # copies are deliberately duplicated (see the header), so keep them
          # diffable rather than letting each grow its own variant.
          cfg() {
            grep -E "^[[:space:]]*$1[[:space:]]*=" .jst/jira-sdlc-tools.env \
              | tail -1 | sed -e 's/^[^=]*=[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          for k in DEFAULT_BASE_BRANCH; do
            v=$(cfg "$k")
            if [ -z "$v" ]; then
              echo "::error::$k is unset in .jst/jira-sdlc-tools.env"
              exit 1
            fi
            echo "$(echo "$k" | tr '[:upper:]' '[:lower:]')=$v" >> "$GITHUB_OUTPUT"
            echo "$k=$v"
          done

      - name: Stand on the base branch
        shell: bash
        env:
          BASE: ${{ steps.config.outputs.default_base_branch }}
        run: |
          set -euo pipefail
          # Same as job 2: the workspace stays a main checkout on a long-lived
          # branch and supplies the skills, while the review itself happens in
          # the linked worktree below. (Job 1 explains why not PRODUCTION_BRANCH.)
          git switch "$BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install claude CLI (native, no npm)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rebuild the issue worktree
        id: worktree
        shell: bash
        env:
          BRANCH: ${{ needs.assign.outputs.branch }}
          KEY: ${{ needs.assign.outputs.issue_key }}
          PR_BASE: ${{ needs.assign.outputs.pr_base }}
        run: |
          set -euo pipefail
          WT="$RUNNER_TEMP/worktrees/worktree-$KEY"
          # The executor pushed its commits, so take the branch from origin
          # again rather than assuming job 2's disk state.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git worktree add --track -B "$BRANCH" "$WT" "origin/$BRANCH"
          # The reviewer resolves the PR's base with the same resolver, so it
          # needs parentbranch re-set here too.
          git config "branch.$BRANCH.parentbranch" "$PR_BASE"
          echo "path=$WT" >> "$GITHUB_OUTPUT"

      - name: Run jira-task-reviewer
        timeout-minutes: 25
        shell: bash
        working-directory: ${{ steps.worktree.outputs.path }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Bare, no key: the reviewer derives the issue from the branch. This
          # is a single-step top-level issue (5C forces single-step for a
          # hotfix), so it reviews one PR — the one into the production branch.
          claude --plugin-dir "$GITHUB_WORKSPACE/plugins/jira-sdlc" \
            --dangerously-skip-permissions \
            -p "/jira-sdlc:jira-task-reviewer" \
            2>&1 | tee "$RUNNER_TEMP/reviewer.log"

      - name: Summarize
        if: always()
        shell: bash
        env:
          KEY: ${{ needs.assign.outputs.issue_key }}
          BRANCH: ${{ needs.assign.outputs.branch }}
        run: |
          set -euo pipefail
          {
            echo "### Reviewed \`$KEY\` on \`$BRANCH\`"
            echo ""
            echo "Nothing was merged — the reviewer never merges, and this demo"
            echo "stops here. A real hotfix needs a human to merge the PR."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reviewer log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewer-log
          path: ${{ runner.temp }}/reviewer.log
          if-no-files-found: warn
          retention-days: 7
