# stack.d/resources.conf: this stack's host resources (the stack contract, version 1), read by
# ./stack and by its callers. Plain KEY=value lines and comments only.

# Every name an instance makes: <NAME_PREFIX>-i<N>.
NAME_PREFIX=vitespa

# Instance N (INSTANCE_MIN..INSTANCE_MAX) gets PORTS_PER_INSTANCE ports from
# PORT_BASE + (N - INSTANCE_MIN) x PORTS_PER_INSTANCE; its dev server takes the first.
INSTANCE_MIN=1
INSTANCE_MAX=100
PORT_BASE=24000
PORT_COUNT=1000
PORTS_PER_INSTANCE=10

# The main checkout's dev server (the project's own key; callers ignore it).
MAIN_WEB_PORT=5173
